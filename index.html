<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Serverless URL Shortener</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    input, button { padding: 10px; font-size: 16px; }
    input { width: 70%; }
    button { cursor: pointer; }
    #result { margin-top: 20px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Shorten a URL</h2>
  <input id="longUrl" type="text" placeholder="Paste your long URL here">
  <button onclick="shortenUrl()">Shorten</button>
  <div id="result"></div>

  <script>
    // Replace with your actual API Gateway invoke URL for the "create" endpoint
    const API_ENDPOINT = "https://hrm92obrd9.execute-api.eu-west-1.amazonaws.com/prod";

    async function shortenUrl() {
      const longUrl = document.getElementById("longUrl").value;
      const resultDiv = document.getElementById("result");

      if (!longUrl) {
        resultDiv.textContent = "Please enter a URL.";
        return;
      }

      resultDiv.textContent = "Shortening...";

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: longUrl })
        });

        const data = await response.json();

        if (data.shortUrl) {
          resultDiv.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
        } else {
          resultDiv.textContent = "Error: " + (data.error || "Unknown error");
        }
      } catch (err) {
        resultDiv.textContent = "Request failed: " + err.message;
      }
    }
  </script>
</body>
</html>
