<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten — a serverless URL shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2F5;
    --card: #FFFFFF;
    --ink: #16202B;
    --ink-soft: #4A5A68;
    --accent: #2F6F5E;
    --accent-dark: #215043;
    --line: #D7E0E6;
    --error: #B3432B;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 8px 2px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.15;
    margin: 0 0 28px 2px;
    letter-spacing: -0.01em;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 1px 2px rgba(22, 32, 43, 0.04);
  }

  .field-row {
    display: flex;
    gap: 10px;
  }

  input[type="url"] {
    flex: 1;
    min-width: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
    transition: border-color 0.15s ease;
  }

  input[type="url"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  input[type="url"]::placeholder {
    color: #8FA0AC;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #F2F7F5;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }

  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 2px solid var(--accent-dark); outline-offset: 2px; }
  button:disabled { background: #9BB3AC; cursor: default; }

  .result {
    margin-top: 18px;
    min-height: 20px;
  }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--ink-soft);
    word-break: break-all;
  }

  .status-line a {
    color: var(--accent-dark);
  }

  .status-line.error { color: var(--error); }

  .result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .result-row a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--accent-dark);
    text-decoration: none;
    word-break: break-all;
    flex: 1;
  }

  .result-row a:hover { text-decoration: underline; }

  .copy-btn {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 6px 12px;
    font-size: 13px;
    flex-shrink: 0;
  }

  .copy-btn:hover { background: var(--line); color: var(--ink); }

  .recent {
    margin-top: 28px;
  }

  .recent-label {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .recent-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .recent-item:last-child { border-bottom: none; }

  .recent-original {
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .recent-short a {
    color: var(--accent-dark);
    text-decoration: none;
  }

  .recent-short a:hover { text-decoration: underline; }

  footer {
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (max-width: 480px) {
    .field-row { flex-direction: column; }
    button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">serverless · aws lambda + dynamodb + api gateway</p>
    <h1>Turn a long link into something you'd actually share.</h1>

    <div class="card">
      <div class="field-row">
        <input type="url" id="longUrl" placeholder="https://example.com/a/very/long/path" />
        <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
      </div>

      <div class="result" id="result"></div>

      <div class="recent" id="recentSection" style="display:none;">
        <p class="recent-label">Shortened this session</p>
        <div id="recentList"></div>
      </div>
    </div>

    <footer>Links are stored in a live DynamoDB table — refresh and they're still there.</footer>
  </div>

  <script>
    const API_ENDPOINT = "https://hrm92obrd9.execute-api.eu-west-1.amazonaws.com/prod/create";
    const recent = [];

    function renderRecent() {
      const section = document.getElementById("recentSection");
      const list = document.getElementById("recentList");
      if (recent.length === 0) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";
      list.innerHTML = recent.slice().reverse().map(item => `
        <div class="recent-item">
          <span class="recent-original">${item.original}</span>
          <span class="recent-short"><a href="${item.short}" target="_blank">${item.short.replace('https://', '')}</a></span>
        </div>
      `).join("");
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }

    async function shortenUrl() {
      const input = document.getElementById("longUrl");
      const resultDiv = document.getElementById("result");
      const btn = document.getElementById("shortenBtn");
      const longUrl = input.value.trim();

      if (!longUrl) {
        resultDiv.innerHTML = `<p class="status-line error">Add a URL first — the field's empty.</p>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = "Shortening…";
      resultDiv.innerHTML = `<p class="status-line">Contacting the API…</p>`;

      try {
        const response = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: longUrl })
        });

        const data = await response.json();

        if (data.shortUrl) {
          resultDiv.innerHTML = `
            <div class="result-row">
              <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>
              <button class="copy-btn" onclick="copyToClipboard('${data.shortUrl}', this)">Copy</button>
            </div>
          `;
          recent.push({ original: longUrl, short: data.shortUrl });
          renderRecent();
          input.value = "";
        } else {
          resultDiv.innerHTML = `<p class="status-line error">The API didn't return a short link: ${data.error || "unknown error"}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p class="status-line error">Couldn't reach the API — check your connection and try again.</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Shorten";
      }
    }

    document.getElementById("longUrl").addEventListener("keydown", (e) => {
      if (e.key === "Enter") shortenUrl();
    });
  </script>
</body>
</html>
